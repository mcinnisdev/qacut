name: Release

# Pushing a tag like v2.1.0 builds the installers on Windows and publishes
# a GitHub release with them and generated notes. `npm run release 2.1.0`
# (scripts/release.mjs) bumps the version everywhere, commits, tags and
# pushes, which is what triggers this. The site's Download links point at
# releases/latest, so they pick the new one up on their own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build installers
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the notes step lists commits since the previous tag

      - name: Tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./package.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag but package.json says $ver" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Code signing with SSL.com eSigner: CodeSignTool signs the app exe
      # and each installer through scripts/sign.cmd, which Tauri runs as
      # bundle.windows.signCommand. Skipped, and the build left unsigned,
      # when the ESIGNER_* secrets are not set.
      - name: Code signing (eSigner)
        if: ${{ env.ESIGNER_USERNAME != '' }}
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
        run: |
          Invoke-WebRequest -Uri https://www.ssl.com/download/codesigntool-for-windows/ -OutFile CodeSignTool.zip
          Expand-Archive CodeSignTool.zip -DestinationPath C:\CodeSignTool
          $bat = Get-ChildItem C:\CodeSignTool -Recurse -Filter CodeSignTool.bat | Select-Object -First 1
          if (-not $bat) { throw "CodeSignTool.bat not in the download" }
          "CODESIGNTOOL_PATH=$($bat.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sign = Join-Path $env:GITHUB_WORKSPACE "scripts\sign.cmd"
          $conf = @{ bundle = @{ windows = @{ signCommand = @{ cmd = "cmd"; args = @("/c", $sign, "%1") } } } }
          $conf | ConvertTo-Json -Depth 6 | Out-File -FilePath src-tauri/tauri.ci.conf.json -Encoding utf8
          "TAURI_CI_CONFIG=--config src-tauri/tauri.ci.conf.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGN_LOG=$env:GITHUB_WORKSPACE\sign.log" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Builds the app, creates a draft release for the tag, and uploads
      # the MSI and NSIS installers to it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the installers so Check for updates can trust them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code signing (see above); empty when the secrets are not set.
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QACut ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ env.TAURI_CI_CONFIG }}

      # Tauri does not show what the signing command printed; the script
      # logs it, and this shows it whether the build passed or not.
      - name: Signing log
        if: ${{ always() && env.ESIGNER_USERNAME != '' }}
        shell: bash
        run: cat sign.log 2>/dev/null || echo "no signing log"

      # GitHub's own note generator lists pull requests, and this repo ships
      # by direct commits, so the notes are the commit subjects since the
      # previous tag.
      - name: Release notes from the commits, then publish
        shell: bash
        run: |
          git fetch --tags --force --quiet
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          {
            echo "Windows 10 (2004+) or 11, x64. The app and installers are code-signed (SSL.com, Nicholas McInnis). While the certificate is new, SmartScreen may still warn on first run: choose **More info**, then **Run anyway**."
            echo
            echo "## What changed"
            echo
            git log "$range" --format='- %s (%h)' --no-merges | grep -v '^- Release v'
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > body.md
          # The updater's manifest carries the same notes, so the in-app
          # update dialog can show what changed.
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --output latest.json --clobber
          jq --rawfile n body.md '.notes = $n' latest.json > latest.notes.json
          mv latest.notes.json latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          gh release edit "$GITHUB_REF_NAME" --title "QACut $GITHUB_REF_NAME" --notes-file body.md --draft=false --latest
