name: Release

# Pushing a tag like v2.1.0 builds the installers on Windows and publishes
# a GitHub release with them and generated notes. `npm run release 2.1.0`
# (scripts/release.mjs) bumps the version everywhere, commits, tags and
# pushes, which is what triggers this. The site's Download links point at
# releases/latest, so they pick the new one up on their own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build installers
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the notes step lists commits since the previous tag

      - name: Tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./package.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag but package.json says $ver" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Builds the app, creates a draft release for the tag, and uploads
      # the MSI and NSIS installers to it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the installers so Check for updates can trust them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QACut ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true

      # GitHub's own note generator lists pull requests, and this repo ships
      # by direct commits, so the notes are the commit subjects since the
      # previous tag.
      - name: Release notes from the commits, then publish
        shell: bash
        run: |
          git fetch --tags --force --quiet
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          {
            echo "Windows 10 (2004+) or 11, x64. The installers are not code-signed yet: SmartScreen will warn on first run; choose **More info**, then **Run anyway**."
            echo
            echo "## What changed"
            echo
            git log "$range" --format='- %s (%h)' --no-merges | grep -v '^- Release v'
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > body.md
          gh release edit "$GITHUB_REF_NAME" --title "QACut $GITHUB_REF_NAME" --notes-file body.md --draft=false --latest
