<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="edit">
    <div class="edit-wrap">
      <div class="edit-head" data-tauri-drag-region>
        <span class="edit-title" id="title" data-tauri-drag-region>Edit</span>
        <div class="swatches" role="group" aria-label="Colour for the next mark, or the selected one">
          <button class="swatch" data-color="#ff5b5b" style="--c: #ff5b5b" title="Coral"></button>
          <button class="swatch" data-color="#ffc400" style="--c: #ffc400" title="Amber"></button>
          <button class="swatch" data-color="#2ecc71" style="--c: #2ecc71" title="Green"></button>
          <button class="swatch" data-color="#3b82f6" style="--c: #3b82f6" title="Blue"></button>
          <button class="swatch" data-color="#141414" style="--c: #141414" title="Black"></button>
          <button class="swatch" data-color="#ffffff" style="--c: #ffffff" title="White"></button>
        </div>
        <select class="frame-select" id="frame-style" title="Frame: what a copied or exported shot sits on. Files on disk stay plain." aria-label="Frame">
          <option value="none">No frame</option>
        </select>
        <button class="quiet" id="frame-adjust" title="Adjust the frame for this shot only: size, position, corners, shadow" aria-expanded="false">Adjust</button>
        <span class="spacer" data-tauri-drag-region></span>
        <button class="quiet" id="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button class="quiet" id="clear" title="Remove all marks">Clear</button>
        <button class="btn" id="cancel" title="Cancel (Esc)">Cancel</button>
        <button class="btn primary" id="save" title="Save (Enter)">Save</button>
      </div>
      <!-- This shot's own frame: knobs over the brand's defaults, for when
           they do not quite fit it. Kept beside the shot. -->
      <div class="frame-panel" id="frame-panel" hidden>
        <canvas class="frame-preview" id="frame-preview" aria-label="Preview of the copied shot"></canvas>
        <div class="frame-knobs">
          <label class="lib-field" id="fp-fit-row">
            <span>Shot size <b id="fp-fit-v"></b></span>
            <input type="range" id="fp-fit" min="0.3" max="1" step="0.01" />
          </label>
          <label class="lib-field" id="fp-pad-row">
            <span>Padding <b id="fp-pad-v"></b></span>
            <input type="range" id="fp-pad" min="0.02" max="0.25" step="0.01" />
          </label>
          <label class="lib-field" id="fp-x-row">
            <span>Left / right <b id="fp-x-v"></b></span>
            <input type="range" id="fp-x" min="-1" max="1" step="0.02" />
          </label>
          <label class="lib-field" id="fp-y-row">
            <span>Up / down <b id="fp-y-v"></b></span>
            <input type="range" id="fp-y" min="-1" max="1" step="0.02" />
          </label>
          <label class="lib-field" id="fp-anchor-row">
            <span>When the picture must be cropped, keep</span>
            <select class="field" id="fp-anchor">
              <option value="center">The middle</option>
              <option value="top">The top</option>
              <option value="bottom">The bottom</option>
            </select>
          </label>
          <label class="lib-field">
            <span>Corners <b id="fp-radius-v"></b></span>
            <input type="range" id="fp-radius" min="0" max="40" step="1" />
          </label>
          <label class="lib-field check-field"><input type="checkbox" id="fp-shadow" /> <span>Shadow</span></label>
          <div class="frame-panel-foot">
            <button class="linkish" id="fp-reset" title="Drop this shot's changes and use the frame's own settings">Use defaults</button>
            <button class="btn" id="fp-done">Done</button>
          </div>
        </div>
      </div>
      <div class="edit-main">
        <div class="edit-body" id="body">
          <!-- The shot, on its frame when one is picked, as it will be copied. -->
          <div class="edit-stage" id="stage">
            <canvas id="canvas"></canvas>
            <div class="stage-note" id="stage-note" hidden></div>
          </div>
          <input class="text-entry" id="text-entry" hidden placeholder="Type, then Enter" aria-label="Text label" />
        </div>
        <!-- Review mode: the shot's place in the bundle, its note, and a way
             to the next one, so a whole auto-captured run can be cleaned up
             without going back to the bundle window. -->
        <!-- Quick shot: one shot, one decision. Copy (picture, note under
             it), Copy for agent (path and note as text), Add to batch (kept
             for a hand-off with more shots) or Discard. -->
        <aside class="edit-side" id="quick-side" hidden>
          <div class="edit-side-head">
            <span class="edit-count" id="quick-count">Quick shot</span>
            <span class="edit-hint" id="quick-hint"></span>
          </div>
          <select class="field" id="quick-prompt" aria-label="Prompt for the agent hand-off" hidden></select>
          <textarea class="field" id="quick-note" placeholder="Note (optional)" aria-label="Note"></textarea>
          <div class="edit-side-actions">
            <button class="btn primary" id="quick-copy" title="Copy the picture, with the note printed under it if you wrote one (Ctrl+C)">Copy</button>
            <button class="btn" id="quick-agent" title="Copy the path and note as text, for an agent (Ctrl+Shift+A)">Copy for agent</button>
          </div>
          <div class="edit-side-actions">
            <button class="btn" id="quick-batch" title="Keep this shot in the batch, to hand several to an agent at once (Ctrl+B)">Add to batch</button>
          </div>
          <div class="edit-batch-row" id="quick-batch-row" hidden>
            <span id="quick-batch-label"></span>
            <button class="linkish" id="quick-show-batch">Show batch</button>
          </div>
          <div class="edit-side-nav">
            <span class="spacer"></span>
            <button class="linkish danger" id="quick-discard" title="Delete this shot (Esc)">Discard</button>
          </div>
          <span class="edit-status" id="quick-status"></span>
        </aside>
        <aside class="edit-side" id="side" hidden>
          <div class="edit-side-head">
            <span class="edit-count" id="count"></span>
            <span class="edit-moment" id="moment"></span>
          </div>
          <input class="field" id="shot-title" placeholder="Shot name (optional)" aria-label="Shot name" />
          <textarea class="field" id="shot-note" placeholder="What's wrong here, or what is happening?" aria-label="Note"></textarea>
          <div class="edit-side-nav">
            <button class="btn" id="prev" title="Previous shot (←)">&larr; Prev</button>
            <button class="btn" id="next" title="Next shot (→)">Next &rarr;</button>
            <button class="btn" id="review-copy" title="Copy the picture with the note under it (Ctrl+C)">Copy</button>
            <span class="spacer"></span>
            <button class="linkish danger" id="delete-shot" title="Remove this shot from the bundle">Delete shot</button>
          </div>
        </aside>
      </div>
      <!-- The quick batch: every shot waiting for a hand-off, to open or drop. -->
      <div class="edit-strip" id="quick-strip" hidden>
        <div class="edit-strip-head">
          <span class="edit-count" id="quick-strip-count"></span>
          <span class="edit-hint">Click a shot to open it; &times; drops it.</span>
          <span class="spacer"></span>
          <button class="btn primary" id="quick-strip-copy" title="Copy every shot's path and note for an agent, then close the batch">Copy batch for agent</button>
          <button class="linkish danger" id="quick-strip-discard" title="Delete every shot in the batch">Discard batch</button>
          <button class="linkish" id="quick-strip-hide">Hide</button>
        </div>
        <div class="edit-strip-list" id="quick-strip-list"></div>
      </div>
      <div class="edit-foot">
        <span class="foot-tools" role="group" aria-label="Tools">
          <button class="foot-tool" data-tool="move" title="Move a mark (M)"><kbd>M</kbd> move</button>
          <button class="foot-tool" data-tool="arrow" title="Arrow (A)"><kbd>A</kbd> arrow</button>
          <button class="foot-tool" data-tool="rect" title="Highlight (H)"><kbd>H</kbd> highlight</button>
          <button class="foot-tool" data-tool="blur" title="Blur (B)"><kbd>B</kbd> blur</button>
          <button class="foot-tool" data-tool="step" title="Step counter (S)"><kbd>S</kbd> step</button>
          <button class="foot-tool" data-tool="text" title="Text label (T)"><kbd>T</kbd> text</button>
        </span>
        <span id="foot-keys"><kbd>←↑↓→</kbd> nudge <kbd>Del</kbd> remove <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo <kbd>Enter</kbd> save <kbd>Esc</kbd> cancel</span>
      </div>
    </div>
    <script type="module" src="/src/edit.ts"></script>
  </body>
</html>
