<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="edit">
    <div class="edit-wrap">
      <div class="edit-head" data-tauri-drag-region>
        <span class="edit-title" id="title" data-tauri-drag-region>Edit</span>
        <div class="tools" id="tools">
          <button class="tool" data-tool="move" title="Move a mark (M)">Move</button>
          <button class="tool" data-tool="arrow" title="Arrow (A)">Arrow</button>
          <button class="tool" data-tool="rect" title="Highlight (H)">Highlight</button>
          <button class="tool" data-tool="blur" title="Blur (B)">Blur</button>
          <button class="tool" data-tool="step" title="Step counter (S)">Step</button>
        </div>
        <span class="spacer" data-tauri-drag-region></span>
        <button class="quiet" id="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button class="quiet" id="clear" title="Remove all marks">Clear</button>
        <button class="btn" id="cancel" title="Cancel (Esc)">Cancel</button>
        <button class="btn primary" id="save" title="Save (Enter)">Save</button>
      </div>
      <div class="edit-main">
        <div class="edit-body" id="body">
          <canvas id="canvas"></canvas>
        </div>
        <!-- Review mode: the shot's place in the bundle, its note, and a way
             to the next one, so a whole auto-captured run can be cleaned up
             without going back to the bundle window. -->
        <!-- Quick shot: note it and hand it to an agent, or mark it up and
             copy the image for a person. Enter saves and keeps the batch
             open; Ctrl+Enter finishes and hands off. -->
        <aside class="edit-side" id="quick-side" hidden>
          <div class="edit-side-head">
            <span class="edit-count" id="quick-count">Quick shot</span>
            <span class="edit-hint" id="quick-hint"></span>
          </div>
          <select class="field" id="quick-prompt" aria-label="Prompt to wrap the hand-off in" hidden></select>
          <textarea class="field" id="quick-note" placeholder="What should the agent do with this?" aria-label="Note"></textarea>
          <div class="edit-side-actions">
            <button class="btn primary" id="quick-save" title="Save the note and copy the shot: the path and note as text, and the picture with the note under it (Enter)">Save + copy</button>
            <button class="btn" id="quick-copy-image" title="Copy the marked-up image to the clipboard (Ctrl+Shift+C)">Copy image</button>
          </div>
          <div class="edit-side-actions">
            <button class="btn" id="quick-finish" title="Copy every shot in the batch with its note and close the batch (Ctrl+Enter)">Finish and hand off</button>
          </div>
          <div class="edit-side-nav">
            <button class="linkish" id="quick-new-batch" hidden title="Move this shot into a fresh batch">New batch</button>
            <span class="spacer"></span>
            <button class="linkish danger" id="quick-discard" title="Delete this shot">Discard shot</button>
          </div>
          <span class="edit-status" id="quick-status"></span>
        </aside>
        <aside class="edit-side" id="side" hidden>
          <div class="edit-side-head">
            <span class="edit-count" id="count"></span>
            <span class="edit-moment" id="moment"></span>
          </div>
          <input class="field" id="shot-title" placeholder="Shot name (optional)" aria-label="Shot name" />
          <textarea class="field" id="shot-note" placeholder="What's wrong here, or what is happening?" aria-label="Note"></textarea>
          <div class="edit-side-nav">
            <button class="btn" id="prev" title="Previous shot (←)">&larr; Prev</button>
            <button class="btn" id="next" title="Next shot (→)">Next &rarr;</button>
            <span class="spacer"></span>
            <button class="linkish danger" id="delete-shot" title="Remove this shot from the bundle">Delete shot</button>
          </div>
        </aside>
      </div>
      <div class="edit-foot">
        <span><kbd>M</kbd> move <kbd>A</kbd> arrow <kbd>H</kbd> highlight <kbd>B</kbd> blur <kbd>S</kbd> step</span>
        <span id="foot-keys"><kbd>←↑↓→</kbd> nudge <kbd>Del</kbd> remove <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo <kbd>Enter</kbd> save <kbd>Esc</kbd> cancel</span>
      </div>
    </div>
    <script type="module" src="/src/edit.ts"></script>
  </body>
</html>
