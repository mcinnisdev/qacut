<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bundle</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="peek">
    <div class="peek-wrap">
      <!-- Menu bar. Every command lives here with its shortcut; the rows
           below carry only the bundle's name and the one primary action. -->
      <div class="peek-head" data-tauri-drag-region>
        <nav class="menubar" id="menubar" aria-label="Bundle menu"></nav>
        <span class="spacer" data-tauri-drag-region></span>
        <span class="count" id="count" data-tauri-drag-region></span>
        <button class="icon-btn" id="close" title="Close (Esc)" aria-label="Close">
          &times;
        </button>
      </div>
      <div class="peek-title">
        <input
          class="bundle-name"
          id="bundle-name"
          placeholder="Name this bundle"
          aria-label="Bundle name"
        />
        <div class="segmented">
          <select id="purpose" aria-label="What this bundle is for">
            <option value="fix">Fix issues</option>
            <option value="document">Write process doc</option>
            <option value="custom">Custom prompt</option>
          </select>
          <select id="doc-format" aria-label="Document format" hidden>
            <option value="markdown">as Markdown</option>
            <option value="html">as web page</option>
          </select>
          <button class="btn primary" id="copy-prompt">Copy agent prompt</button>
        </div>
        <button class="btn" id="export-doc" title="Write a finished process document from this bundle, no agent needed">Export doc</button>
      </div>
      <div class="bundles" id="bundles" hidden>
        <div class="panel-head">
          <span>Open a bundle</span>
          <button class="quiet" id="bundles-close">Close</button>
        </div>
        <div class="bundles-list" id="bundles-list"></div>
      </div>
      <div class="brand" id="brand" hidden>
        <div class="brand-row">
          <label class="check">
            <input type="checkbox" id="brand-include" />
            Include in this bundle
          </label>
          <span class="brand-files" id="brand-files"></span>
          <button class="btn" id="brand-manage">Brands…</button>
          <button class="btn" id="brand-open">Open brand folder</button>
          <button class="quiet" id="brand-close">Close</button>
        </div>
        <textarea
          id="brand-notes"
          placeholder="Voice and style notes for the agent: tone, audience, words to use and avoid, how the business refers to itself. Drop logos, colours, fonts and style guides into the brand folder; everything there is copied into the bundle."
        ></textarea>
      </div>
      <div class="custom" id="custom" hidden>
        <textarea
          id="custom-prompt"
          placeholder="Your own instructions for the agent. {root} becomes the bundle folder path and {name} the bundle name. Saved to ~/QACut/custom-prompt.txt and reused for every bundle."
        ></textarea>
      </div>
      <div class="shortcuts" id="shortcuts" hidden>
        <div class="panel-head">
          <span>Keyboard shortcuts</span>
          <button class="quiet" id="shortcuts-close">Close</button>
        </div>
        <p class="hint">Click a field and press the keys you want. Global shortcuts need a modifier. Leave a field empty to turn that shortcut off.</p>
        <div class="shortcut-rows" id="shortcut-rows"></div>
        <div class="row">
          <button class="btn primary" id="shortcuts-save">Save</button>
          <button class="quiet" id="shortcuts-reset">Reset to defaults</button>
        </div>
        <p class="hint" style="margin-top: 18px">Inside each window. These are fixed for now; the global ones above follow your settings everywhere they are shown.</p>
        <div class="shortcut-ref" id="shortcut-ref"></div>
      </div>
      <div class="exported" id="exported">
        <span id="exported-label">Bundle written to</span>
        <code id="exported-path"></code>
      </div>
      <div class="peek-body" id="body"></div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <script type="module" src="/src/peek.ts"></script>
  </body>
</html>
